<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="SiteSpy — find local businesses that need a better website.">
<title>SiteSpy — Find local businesses that need a better website</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root {
  /* palette */
  --bg: #0B1020;
  --surface: #131B2E;
  --raised: #1A2438;
  --border: #1E2A45;
  --border-strong: #2C3B5E;
  --text: #E6ECF7;
  --text-2: #94A3B8;
  --text-3: #5B6B84;
  --accent: #F59E0B;
  --accent-2: #FBBF24;
  --accent-grad: linear-gradient(135deg, #F59E0B 0%, #FBBF24 100%);
  --success: #10B981;
  --warning: #F59E0B;
  --danger: #EF4444;
  --info: #38BDF8;
  --orange: #F97316;
  --yellow: #EAB308;

  /* radii */
  --r-sm: 6px;
  --r-md: 8px;
  --r-lg: 12px;
  --r-xl: 16px;
  --r-full: 999px;

  /* spacing */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 20px;
  --s-6: 24px;
  --s-8: 32px;

  /* shadows */
  --shadow-sm: 0 1px 2px rgba(0,0,0,.25), 0 4px 12px rgba(0,0,0,.18);
  --shadow-md: 0 2px 6px rgba(0,0,0,.2), 0 8px 24px rgba(0,0,0,.3);
  --shadow-lg: 0 16px 48px rgba(0,0,0,.45);
  --glow-amber: 0 6px 20px rgba(245,158,11,.35);

  /* motion */
  --t-fast: 150ms ease;
  --t: 200ms ease;
  --t-slow: 300ms cubic-bezier(.4,0,.2,1);

  /* type */
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
}

/* ============================================================
   RESET & BASE
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
}
/* ambient hero glow behind content */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(640px 340px at 50% -120px, rgba(245,158,11,.08), transparent 70%),
    radial-gradient(480px 260px at 88% -60px, rgba(56,189,248,.05), transparent 70%);
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button { cursor: pointer; font-family: inherit; }
svg { display: block; }
:focus-visible { outline: 2px solid rgba(245,158,11,.6); outline-offset: 2px; }

/* subtle custom scrollbar */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #263350; border-radius: 8px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: #33466b; }

/* ============================================================
   HEADER
   ============================================================ */
.header {
  position: sticky;
  top: 0;
  z-index: 60;
  background: rgba(11,16,32,.72);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.header-inner {
  max-width: 1200px;
  margin: 0 auto;
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark {
  width: 34px; height: 34px;
  border-radius: 10px;
  background: var(--accent-grad);
  display: grid; place-items: center;
  color: #0B1020;
  box-shadow: var(--glow-amber);
}
.brand-mark svg { width: 20px; height: 20px; }
.brand-text { font-size: 20px; font-weight: 800; letter-spacing: -.02em; color: var(--text); }
.brand-text em {
  font-style: normal;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
}

/* pill tab bar */
.tab-bar {
  display: flex;
  gap: 6px;
  background: rgba(26,36,56,.6);
  padding: 4px;
  border: 1px solid var(--border);
  border-radius: var(--r-full);
}
.tab-bar button {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 16px;
  border: none;
  background: transparent;
  border-radius: var(--r-full);
  color: var(--text-2);
  font-size: .88rem;
  font-weight: 600;
  transition: color var(--t-fast), background var(--t-fast), box-shadow var(--t);
}
.tab-bar button svg { width: 15px; height: 15px; }
.tab-bar button:hover { color: var(--text); background: rgba(255,255,255,.05); }
.tab-bar button.active {
  color: #0B1020;
  background: var(--accent-grad);
  box-shadow: var(--glow-amber);
}
.badge {
  background: var(--accent);
  color: #0B1020;
  font-size: .68rem;
  font-weight: 700;
  padding: 1px 7px;
  border-radius: var(--r-full);
  min-width: 20px;
  text-align: center;
  line-height: 1.6;
}
.tab-bar button.active .badge { background: rgba(11,16,32,.88); color: var(--accent-2); }

/* ============================================================
   MAIN + SEARCH HERO
   ============================================================ */
.main {
  position: relative;
  z-index: 1;
  max-width: 1200px;
  margin: 0 auto;
  padding: 28px 24px 72px;
}
.tab-panel { animation: fadeIn .25s ease both; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.search-card {
  position: relative;
  overflow: hidden;
  background: linear-gradient(180deg, var(--raised), var(--surface));
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  padding: 24px;
  box-shadow: var(--shadow-md);
  margin-bottom: 20px;
}
.search-card::before {
  content: '';
  position: absolute;
  top: -80px; right: -60px;
  width: 260px; height: 260px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(245,158,11,.10), transparent 70%);
  pointer-events: none;
}
.hero-title { font-size: 1.625rem; font-weight: 700; letter-spacing: -.02em; color: var(--text); margin-bottom: 6px; }
.hero-sub { font-size: .92rem; color: var(--text-2); max-width: 580px; margin-bottom: 20px; }

/* ============================================================
   SEARCH CONTROLS
   ============================================================ */
.search-wrapper {
  display: flex;
  gap: 10px;
  margin-bottom: 14px;
  flex-wrap: wrap;
  align-items: stretch;
}
.autocomplete { position: relative; flex: 1; min-width: 220px; display: flex; }
.autocomplete .input-icon {
  position: absolute;
  left: 13px; top: 50%;
  transform: translateY(-50%);
  width: 17px; height: 17px;
  color: var(--text-3);
  pointer-events: none;
  z-index: 1;
}
.autocomplete input[type="text"] {
  width: 100%;
  min-width: 0;
  flex: 1;
  padding: 12px 16px 12px 40px;
  font-size: .95rem;
  font-family: inherit;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  color: var(--text);
  outline: none;
  transition: border-color var(--t-fast), box-shadow var(--t-fast), background var(--t-fast);
}
.autocomplete input[type="text"]:hover { border-color: var(--border-strong); }
.autocomplete input[type="text"]:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(245,158,11,.16);
  background: #0D1428;
}
.autocomplete input[type="text"]::placeholder { color: var(--text-3); }

.count-select {
  appearance: none;
  -webkit-appearance: none;
  padding: 12px 40px 12px 14px;
  font-size: .9rem;
  font-family: inherit;
  background: var(--raised) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%235B6B84' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>") no-repeat right 12px center / 14px;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  color: var(--text-2);
  outline: none;
  cursor: pointer;
  transition: border-color var(--t-fast), box-shadow var(--t-fast);
}
.count-select:hover { border-color: var(--border-strong); }
.count-select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(245,158,11,.16); }

.btn-search {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 26px;
  font-size: .95rem;
  font-weight: 700;
  font-family: inherit;
  color: #0B1020;
  background: var(--accent-grad);
  border: none;
  border-radius: var(--r-md);
  box-shadow: var(--glow-amber);
  transition: transform var(--t-fast), box-shadow var(--t), filter var(--t-fast);
}
.btn-search svg { width: 17px; height: 17px; }
.btn-search:hover { transform: translateY(-1px); box-shadow: 0 10px 26px rgba(245,158,11,.42); filter: brightness(1.04); }
.btn-search:active { transform: translateY(0); }
.btn-search:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; filter: none; }

.filter-row {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: .85rem;
  color: var(--text-2);
  position: relative;
  z-index: 1;
}
.filter-row input[type="checkbox"] {
  appearance: none;
  -webkit-appearance: none;
  width: 17px; height: 17px;
  border: 1.5px solid var(--border-strong);
  border-radius: 5px;
  background: var(--bg);
  cursor: pointer;
  display: inline-grid;
  place-content: center;
  transition: all var(--t-fast);
}
.filter-row input[type="checkbox"]:hover { border-color: var(--accent); }
.filter-row input[type="checkbox"]:checked {
  background: var(--accent-grad);
  border-color: transparent;
}
.filter-row input[type="checkbox"]:checked::after {
  content: '';
  width: 9px; height: 5px;
  border-left: 2px solid #0B1020;
  border-bottom: 2px solid #0B1020;
  transform: rotate(-45deg) translate(1px,-1px);
}
.filter-row label { cursor: pointer; user-select: none; }

/* ============================================================
   AUTOCOMPLETE DROPDOWNS
   ============================================================ */
.dropdown {
  position: absolute;
  top: calc(100% + 6px);
  left: 0; right: 0;
  background: var(--raised);
  border: 1px solid var(--border-strong);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-lg);
  z-index: 100;
  max-height: 320px;
  overflow-y: auto;
  display: none;
  padding: 6px;
}
.dropdown.open { display: block; animation: fadeIn .15s ease both; }
.dd-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 12px;
  cursor: pointer;
  color: var(--text);
  font-size: .9rem;
  border-radius: var(--r-md);
  white-space: nowrap;
  transition: background var(--t-fast);
}
.dd-item .dd-icon { width: 14px; height: 14px; color: var(--text-3); flex-shrink: 0; }
.dd-item:hover, .dd-item.active { background: rgba(245,158,11,.08); }
.dd-item .dd-main { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dd-item .dd-sub { color: var(--text-3); font-size: .78rem; margin-left: auto; flex-shrink: 0; }
.dd-loading, .dd-none { padding: 10px 12px; color: var(--text-3); font-size: .85rem; }
.dd-loading { display: flex; align-items: center; gap: 8px; }
.dd-none { font-style: italic; }
.mini-spin {
  width: 12px; height: 12px;
  border: 2px solid rgba(245,158,11,.2);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  display: inline-block;
  flex-shrink: 0;
}

/* ============================================================
   STATE BOXES / SPINNER / ERROR
   ============================================================ */
.state-box { text-align: center; padding: 56px 20px; }
.state-box .icon {
  width: 52px; height: 52px;
  margin: 0 auto 14px;
  border-radius: 14px;
  background: var(--raised);
  border: 1px solid var(--border);
  display: grid; place-items: center;
  color: var(--accent);
  box-shadow: var(--shadow-sm);
}
.state-box .icon svg { width: 24px; height: 24px; }
.state-box .title { font-size: 1.05rem; font-weight: 600; color: var(--text); margin-bottom: 6px; }
.state-box .desc { color: var(--text-2); font-size: .88rem; max-width: 460px; margin: 0 auto; }
.state-box.error .icon { color: var(--danger); }
.spinner {
  width: 36px; height: 36px;
  margin: 0 auto;
  border: 3px solid rgba(245,158,11,.14);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.error-msg {
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(239,68,68,.1);
  border: 1px solid rgba(239,68,68,.28);
  color: #FCA5A5;
  padding: 12px 16px;
  border-radius: var(--r-md);
  margin-bottom: 14px;
  font-size: .9rem;
}
.error-msg svg { width: 16px; height: 16px; flex-shrink: 0; }

/* ============================================================
   RESULTS TABLE
   ============================================================ */
.results-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: .82rem; color: var(--text-2); }
.results-meta strong { color: var(--text); font-variant-numeric: tabular-nums; }
.table-wrap {
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  background: var(--surface);
  box-shadow: var(--shadow-sm);
}
table { width: 100%; border-collapse: collapse; font-size: .875rem; min-width: 760px; }
thead th {
  padding: 12px 16px;
  text-align: left;
  font-weight: 600;
  color: var(--text-3);
  font-size: .68rem;
  text-transform: uppercase;
  letter-spacing: .08em;
  white-space: nowrap;
  border-bottom: 1px solid var(--border);
}
tbody td { padding: 14px 16px; border-top: 1px solid var(--border); vertical-align: middle; }
tbody tr:first-child td { border-top: none; }
tbody tr { cursor: pointer; transition: background var(--t-fast); }
tbody tr:hover { background: rgba(245,158,11,.05); }
td.name-col { font-weight: 600; color: var(--accent); transition: color var(--t-fast); }
tbody tr:hover td.name-col { text-decoration: underline; }
td.website-col a {
  color: var(--text-3);
  font-size: .78rem;
  max-width: 160px;
  display: inline-block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  vertical-align: middle;
  transition: color var(--t-fast);
}
td.website-col a:hover { color: var(--accent); }
.tnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--text-3); }

/* status pill badges */
.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: var(--r-full);
  font-size: .72rem;
  font-weight: 600;
  white-space: nowrap;
  letter-spacing: .01em;
}
.status-badge.no-website        { background: rgba(239,68,68,.12);   color: #F87171; border: 1px solid rgba(239,68,68,.22); }
.status-badge.social-only       { background: rgba(245,158,11,.12);  color: #FBBF24; border: 1px solid rgba(245,158,11,.22); }
.status-badge.website-unavailable { background: rgba(249,115,22,.12); color: #FB923C; border: 1px solid rgba(249,115,22,.22); }
.status-badge.outdated          { background: rgba(234,179,8,.12);   color: #FDE047; border: 1px solid rgba(234,179,8,.22); }
.status-badge.poorly-built      { background: rgba(239,68,68,.12);   color: #F87171; border: 1px solid rgba(239,68,68,.22); }
.status-badge.basic             { background: rgba(56,189,248,.12);  color: #7DD3FC; border: 1px solid rgba(56,189,248,.22); }
.status-badge.modern            { background: rgba(16,185,129,.12);  color: #6EE7B7; border: 1px solid rgba(16,185,129,.22); }

/* design pill */
.design-pill {
  display: inline-flex;
  padding: 3px 10px;
  border-radius: var(--r-full);
  font-size: .72rem;
  font-weight: 600;
  white-space: nowrap;
  background: var(--raised);
  color: var(--text-2);
  border: 1px solid var(--border);
}
.design-pill.design-modern   { background: rgba(16,185,129,.1);  color: #6EE7B7; border-color: rgba(16,185,129,.25); }
.design-pill.design-outdated { background: rgba(234,179,8,.1);   color: #FDE047; border-color: rgba(234,179,8,.25); }
.design-pill.design-poorly   { background: rgba(239,68,68,.1);   color: #F87171; border-color: rgba(239,68,68,.25); }
.design-pill.design-basic    { background: rgba(56,189,248,.1);  color: #7DD3FC; border-color: rgba(56,189,248,.25); }

/* mobile friendly icons */
.mobile-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px; height: 20px;
  border-radius: 6px;
}
.mobile-icon svg { width: 13px; height: 13px; }
.mobile-ok { color: var(--success); background: rgba(16,185,129,.12); }
.mobile-bad { color: var(--danger); background: rgba(239,68,68,.12); }

/* save button in table */
.btn-save {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: transparent;
  border: 1px solid var(--border-strong);
  color: var(--text-2);
  font-size: .78rem;
  font-weight: 600;
  padding: 5px 12px;
  border-radius: var(--r-full);
  transition: all var(--t-fast);
  white-space: nowrap;
}
.btn-save svg { width: 13px; height: 13px; }
.btn-save:hover { border-color: var(--accent); color: var(--accent); }
.btn-save.saved { background: rgba(245,158,11,.12); border-color: rgba(245,158,11,.5); color: var(--accent); }

/* ============================================================
   DETAIL SIDEBAR
   ============================================================ */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(3,7,18,.62);
  backdrop-filter: blur(2px);
  z-index: 90;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--t);
}
.overlay.open { opacity: 1; pointer-events: auto; }

.sidebar {
  position: fixed;
  top: 0; right: 0;
  width: 440px;
  max-width: 92vw;
  height: 100vh;
  background: var(--surface);
  border-left: 1px solid var(--border-strong);
  border-radius: 18px 0 0 18px;
  z-index: 100;
  transform: translateX(100%);
  transition: transform var(--t-slow);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-lg);
}
.sidebar.open { transform: translateX(0); }

.sidebar-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  padding: 22px 24px 16px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: rgba(19,27,46,.92);
  backdrop-filter: blur(10px);
  z-index: 2;
}
.sidebar-header h2 { font-size: 1.15rem; font-weight: 700; letter-spacing: -.01em; line-height: 1.35; padding-right: 4px; }
.btn-close {
  display: grid;
  place-items: center;
  width: 30px; height: 30px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  color: var(--text-3);
  flex-shrink: 0;
  transition: all var(--t-fast);
}
.btn-close svg { width: 14px; height: 14px; }
.btn-close:hover { color: var(--danger); border-color: rgba(239,68,68,.5); background: rgba(239,68,68,.08); }

.sidebar-body {
  padding: 20px 24px 28px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.sb-section { display: flex; flex-direction: column; gap: 10px; }
.sb-heading {
  font-size: .66rem;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--text-3);
  font-weight: 700;
}
.sidebar-body .field { display: flex; flex-direction: column; gap: 2px; }
.sidebar-body .field .label { font-size: .75rem; color: var(--text-3); font-weight: 600; }
.sidebar-body .field .value { font-size: .92rem; color: var(--text); }
.sidebar-body .field a.value { color: var(--accent); }

.rating-stars { display: inline-flex; align-items: center; gap: 1px; vertical-align: middle; }
.rating-stars .star { width: 15px; height: 15px; color: var(--accent); }
.rating-stars .star-dim { color: #2A3A5C; }

.signals-list { display: flex; flex-wrap: wrap; gap: 6px; }
.signal-chip {
  background: rgba(245,158,11,.1);
  color: #FBBF24;
  font-size: .76rem;
  padding: 4px 10px;
  border-radius: var(--r-full);
  border: 1px solid rgba(245,158,11,.2);
}

.mobile-status { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; font-size: .9rem; }
.mobile-status svg { width: 15px; height: 15px; }
.mobile-status.yes { color: var(--success); }
.mobile-status.no { color: var(--danger); }

.priority-score {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  border-radius: var(--r-full);
  font-weight: 700;
  font-size: .8rem;
  width: fit-content;
}

function renderResults() {

  let filtered = searchResults;
  if (hideModern) {

  }
  if (searchResults.length === 0 && !isLoading) {
    renderEmptyState();
    return;
  }
  if (filtered.length === 0) {
    if (hideModern && searchResults.length > 0) {
      area.innerHTML = `
        <div class="state-box">

      area.innerHTML = `

          <div class="icon">${ICONS.inbox}</div>
          <div class="title">No leads found</div>
          <div class="desc">Try a different search or broaden your terms.</div>
        </div>

  let rows = '';
  for (const r of filtered) {

    const statusClass = statusToClass(r.status);
    const saved = isLeadSaved(r.id);
    rows += `

        <td>${escapeHtml(r.niche)}</td>

        <td><button class="btn-save btn-save-lead ${saved ? 'saved' : ''}" data-lead-id="${escapeAttr(r.id)}">${saved ? ICONS.star : ICONS.starOutline} ${saved ? 'Saved' : 'Save'}</button></td>
      </tr>
    `;
  }

  area.innerHTML = `
    <div class="results-meta">
      <span>Showing <strong>${filtered.length}</strong> of ${searchResults.length} result(s)</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Business</th><th>Niche</th><th>Website</th><th>Status</th><th>Design</th><th>Mobile</th><th>Save</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

// ===== SEARCH =====
async function doSearch() {
  if (isLoading) return;
  const niche = (document.getElementById('niche-input').value || '').trim();
  const loc = (document.getElementById('location-input').value || '').trim();
  if (!niche && !loc) return;
  const q = niche + ' ' + loc;
  const max = document.getElementById('max-results').value;
  const btn = document.getElementById('btn-search');
  isLoading = true;
  btn.disabled = true;
  searchResults = [];
  renderLoading();

  try {
    const resp = await fetch(`/api/analyze?q=${encodeURIComponent(q)}&max=${max}`);
    const data = await resp.json();
    if (data.error) {
      // If there are results despite the error, show them; otherwise error
      if (data.results && data.results.length > 0) {
        searchResults = data.results;
        renderResults();
      } else {
        renderError(data.error);
      }
    } else {
      searchResults = data.results || [];
      renderResults();
    }
  } catch(e) {
    renderError('Network error — could not reach the server. Is the backend running?');
  } finally {
    isLoading = false;
    btn.disabled = false;
  }
}

// ===== AUTOCOMPLETE =====
const AUTOCOMPLETE_CONFIGS = [
  {
    inputId: 'niche-input', dropdownId: 'niche-dropdown',
    url: '/api/suggest-niches', minChars: 1, type: 'niche'
  },
  {
    inputId: 'location-input', dropdownId: 'location-dropdown',
    url: '/api/suggest-locations', minChars: 2, type: 'location'
  }
];

function setupAutocomplete() {
  for (const cfg of AUTOCOMPLETE_CONFIGS) {
    const input = document.getElementById(cfg.inputId);
    const dd = document.getElementById(cfg.dropdownId);
    if (!input || !dd) continue;

    let debounceTimer = null;
    let reqCounter = 0;          // race protection: only latest response renders
    let items = [];              // current suggestion list (strings or {label,main,sub})
    let activeIdx = -1;          // keyboard-highlighted row
    let closeTimer = null;

    function closeDropdown() {
      dd.classList.remove('open');
      dd.innerHTML = '';
      items = [];
      activeIdx = -1;
    }

    function selectItem(idx) {
      const item = items[idx];
      if (!item) return;
      if (cfg.type === 'location') {
        input.value = item.label;
      } else {
        input.value = item;
      }
      input.focus();
      closeDropdown();
    }

    function renderRows(list) {
      if (!list.length) {
        dd.innerHTML = '<div class="dd-none">No suggestions</div>';
        dd.classList.add('open');
        return;
      }
      dd.innerHTML = list.map((item, i) => {
        if (cfg.type === 'location') {
          const sub = item.sub ? `<span class="dd-sub">${escapeHtml(item.sub)}</span>` : '';
          return `<div class="dd-item" data-idx="${i}" title="${escapeAttr(item.label)}">
            <svg class="dd-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
            <span class="dd-main">${escapeHtml(item.main || item.label)}</span>${sub}
          </div>`;
        }
        return `<div class="dd-item" data-idx="${i}">
          <svg class="dd-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.6 2.6a2 2 0 0 0-1.4-.6H5a2 2 0 0 0-2 2v6.2a2 2 0 0 0 .6 1.4l7.2 7.2a2 2 0 0 0 2.8 0l6.6-6.6a2 2 0 0 0 0-2.8l-7.6-7.8Z"/><circle cx="8" cy="8" r="1.5"/></svg>
          <span class="dd-main">${escapeHtml(item)}</span>
        </div>`;
      }).join('');
      dd.classList.add('open');
    }

    function highlight(idx) {
      activeIdx = idx;
      const rows = dd.querySelectorAll('.dd-item');
      rows.forEach((r, i) => r.classList.toggle('active', i === idx));
      if (rows[idx]) rows[idx].scrollIntoView({ block: 'nearest' });
    }

    async function fetchSuggestions(q) {
      const myReq = ++reqCounter;
      // loading row while in flight
      dd.innerHTML = '<div class="dd-loading"><span class="mini-spin"></span> Searching…</div>';
      dd.classList.add('open');
      try {
        const resp = await fetch(`${cfg.url}?q=${encodeURIComponent(q)}`);
        if (myReq !== reqCounter) return; // stale response — ignore
        const data = await resp.json();
        if (myReq !== reqCounter) return;
        const suggs = data.suggestions || [];
        if (cfg.type === 'location') {
          items = suggs.filter(s => s && s.label);
        } else {
          items = suggs.filter(s => typeof s === 'string');
        }
        activeIdx = -1;
        renderRows(items);
      } catch (e) {
        if (myReq !== reqCounter) return;
        closeDropdown();
      }
    }

    input.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      clearTimeout(closeTimer);
      const q = input.value.trim();
      if (q.length < cfg.minChars) {
        reqCounter++;           // invalidate in-flight request
        closeDropdown();
        return;
      }
      debounceTimer = setTimeout(() => fetchSuggestions(q), 250);
    });

    input.addEventListener('keydown', (e) => {
      const open = dd.classList.contains('open') && items.length > 0;
      if (e.key === 'ArrowDown') {
        if (!open) return;
        e.preventDefault();
        highlight((activeIdx + 1) % items.length);
      } else if (e.key === 'ArrowUp') {
        if (!open) return;
        e.preventDefault();
        highlight((activeIdx - 1 + items.length) % items.length);
      } else if (e.key === 'Enter') {
        if (open && activeIdx >= 0) {
          e.preventDefault();
          selectItem(activeIdx);
        } else if (open) {
          // dropdown open but nothing highlighted — fall through to search
          closeDropdown();
          doSearch();
        } else {
          doSearch();
        }
      } else if (e.key === 'Escape') {
        if (open) { e.preventDefault(); closeDropdown(); }
      }
    });

    input.addEventListener('blur', () => {
      // small delay so a click on a dropdown row registers first
      closeTimer = setTimeout(closeDropdown, 150);
    });

    dd.addEventListener('mousedown', (e) => e.preventDefault()); // keep input focus
    dd.addEventListener('click', (e) => {
      const row = e.target.closest('.dd-item');
      if (!row) return;
      clearTimeout(closeTimer);
      selectItem(parseInt(row.dataset.idx, 10));
    });
  }
}

function renderSavedTab(main) {
  if (savedLeads.length === 0) {
    main.innerHTML = `
      <div class="tab-panel">
        <div class="saved-actions">
          <button class="btn-secondary" onclick="loadSeedLeads()">${ICONS.download} Load Previous Leads</button>
        </div>
        <div class="state-box">
          <div class="icon">${ICONS.bookmark}</div>
          <div class="title">No saved leads yet</div>
          <div class="desc">Search for businesses and save the promising ones!</div>
        </div>
      </div>
    `;
    return;
  }

  // --- Stats ---
  const total = savedLeads.length;
  const statusCounts = {};
  const nicheCounts = {};
  for (const lead of savedLeads) {
    const st = lead.status || 'Unknown';
    statusCounts[st] = (statusCounts[st] || 0) + 1;
    const niche = lead.niche || 'Unknown';
    nicheCounts[niche] = (nicheCounts[niche] || 0) + 1;

  const topNiches = Object.entries(nicheCounts)
    .sort((a, b) => b[1] - a[1])

  }).join(' ');

  const nicheChips = topNiches.map(([n, c]) =>

  ).join(' ');

  const statsHtml = `
    <div class="stats-bar">
      <div class="stat"><span class="stat-label">Total Leads:</span> <span class="stat-value">${total}</span></div>
      <div class="stat"><span class="stat-label">Status:</span> <span class="status-breakdown">${statusBadges}</span></div>

    </div>

  // --- Cards ---
  let cards = '';
  for (const lead of savedLeads) {
    const statusClass = statusToClass(lead.status);
    const domain = extractDomain(lead.website);
    cards += `
      <div class="saved-card">
        <div class="info">
          <div class="name">${escapeHtml(lead.name)}</div>
          <div class="meta">
            ${escapeHtml(lead.niche)} · <span class="status-badge ${statusClass}" style="font-size:0.7rem">${escapeHtml(lead.status)}</span>
            ${domain ? ` · <a href="${escapeAttr(lead.website)}" target="_blank">${escapeHtml(domain)}</a>` : ''}
            · Saved ${formatDate(lead.savedAt)}
          </div>
        </div>
        <button class="btn-danger" onclick="startRemove('${escapeAttr(lead.id)}')">${ICONS.trash} Remove</button>
      </div>
    `;
  }

  main.innerHTML = `
    <div class="tab-panel">
      ${statsHtml}
      <div class="saved-actions">
        <button class="btn-secondary" onclick="loadSeedLeads()">${ICONS.download} Load Previous Leads</button>
        <button class="btn-danger" onclick="clearAllLeads()">${ICONS.trash} Clear All</button>
        <button class="btn-export" onclick="toggleExportData()">${ICONS.copy} Export Data</button>
      </div>
      <div id="export-panel" class="export-panel" style="display:none">
        <div class="export-header">
          <span class="export-title">${ICONS.copy} Export Data</span>
          <button id="btn-copy-export" class="btn-copy" onclick="copyExportData()">${ICONS.copy} Copy</button>
        </div>
        <pre id="export-content" class="export-content"></pre>
      </div>
      ${cards}
    </div>
  `;
}

// ===== CONFIRM REMOVE =====
var removeTargetId = null;

function startRemove(id) {
  var lead = savedLeads.find(function(l) { return l.id === id; });
  if (!lead) return;
  removeTargetId = id;
  var dialog = document.getElementById('confirm-dialog');
  dialog.style.display = 'block';
  dialog.innerHTML =
    '<div class="confirm-overlay" onclick="cancelRemove()">' +
      '<div class="confirm-dialog" onclick="event.stopPropagation()">' +
        '<p>Remove <strong>' + escapeHtml(lead.name) + '</strong>?</p>' +
        '<div class="btns">' +
          '<button class="btn-cancel" onclick="cancelRemove()">Cancel</button>' +
          '<button class="btn-confirm" onclick="doRemoveCurrent()">Remove</button>' +
        '</div>' +
      '</div>' +
    '</div>';
}

function doRemoveCurrent() {
  if (!removeTargetId) return;
  savedLeads = savedLeads.filter(function(l) { return l.id !== removeTargetId; });
  removeTargetId = null;
  saveToStorage();
  updateSavedBadge();
  cancelRemove();
  renderCurrentTab();
}

function cancelRemove() {
  removeTargetId = null;
  document.getElementById('confirm-dialog').style.display = 'none';
  document.getElementById('confirm-dialog').innerHTML = '';
}

// ===== EXPORT FUNCTIONS =====
function toggleExportData() {
  var panel = document.getElementById('export-panel');
  if (!panel) return;

  if (panel.style.display === 'block') {
    panel.style.display = 'none';
    return;
  }

  if (!Array.isArray(savedLeads) || !savedLeads.length) {
    alert('No leads to export. Save some leads first!');
    return;
  }

  // Build the export text
  var lines = [];
  var today = new Date().toISOString().split('T')[0];
  lines.push('SiteSpy Lead Export — ' + today);
  lines.push('Total Leads: ' + savedLeads.length);
  lines.push('');

  // Status breakdown
  var statuses = {};
  savedLeads.forEach(function(l) { var s = l.status || 'Unknown'; statuses[s] = (statuses[s] || 0) + 1; });
  lines.push('By Status: ' + Object.entries(statuses).map(function(e) { return e[0] + ': ' + e[1]; }).join(', '));
  lines.push('');

  // Header
  lines.push('BUSINESS NAME | NICHE | ADDRESS | PHONE | RATING | REVIEWS | WEBSITE | STATUS | DESIGN | MOBILE | SIGNALS | PRIORITY');
  lines.push('-'.repeat(120));

  // Data rows
  savedLeads.forEach(function(lead) {
    var signals = lead.signals || '';
    if (Array.isArray(signals)) signals = signals.join(', ');
    lines.push([
      lead.name || '',
      lead.niche || '',
      lead.address || '',
      lead.phone || '',
      lead.rating || '',
      lead.ratingCount || '',
      lead.website || '',
      lead.status || '',
      lead.design || '',
      lead.mobileFriendly ? 'Yes' : 'No',
      signals,
      lead.priority || ''
    ].join(' | '));
  });

  document.getElementById('export-content').textContent = lines.join('\n');
  panel.style.display = 'block';
}

function copyExportData() {
  var content = document.getElementById('export-content').textContent;
  navigator.clipboard.writeText(content).then(function() {
    var btn = document.getElementById('btn-copy-export');
    var orig = btn.innerHTML;
    btn.innerHTML = ICONS.check + ' Copied!';
    setTimeout(function() { btn.innerHTML = orig; }, 2000);
  }).catch(function() {
    // Fallback for older browsers
    var textarea = document.createElement('textarea');
    textarea.value = content;
    document.body.appendChild(textarea);
    textarea.select();
    document.execCommand('copy');
    document.body.removeChild(textarea);
    alert('Copied to clipboard!');
  });
}

// ===== CLEAR ALL =====
function clearAllLeads() {
  if (!savedLeads.length) return;
  if (!confirm('Remove all ' + savedLeads.length + ' saved leads? This cannot be undone.')) return;
  savedLeads = [];
  saveToStorage();
  updateSavedBadge();
  renderCurrentTab();
}

// ===== HELPERS =====
function statusToClass(status) {
  const map = {
    'No Website': 'no-website',
    'Social Only': 'social-only',
    'Poorly Built': 'poorly-built',
    'Outdated': 'outdated',
    'Basic': 'basic',
    'Modern': 'modern',
    'Website Unavailable': 'website-unavailable',
  };
  return map[status] || '';
}

function designPill(design) {
  const d = (design || '').toLowerCase();
  let cls = 'design-na';
  if (d.indexOf('modern') >= 0) cls = 'design-modern';
  else if (d.indexOf('outdated') >= 0) cls = 'design-outdated';
  else if (d.indexOf('poorly') >= 0) cls = 'design-poorly';
  else if (d.indexOf('basic') >= 0) cls = 'design-basic';
  return `<span class="design-pill ${cls}">${escapeHtml(design || 'N/A')}</span>`;
}

function starRow(rating) {
  if (!rating) return '';
  const full = Math.round(rating);
  let html = '';
  for (let i = 1; i <= 5; i++) {
    html += i <= full
      ? '<svg class="star" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1L12 2z"/></svg>'
      : '<svg class="star star-dim" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1L12 2z"/></svg>';
  }
  return html;
}

function extractDomain(url) {
  if (!url) return '';
  try {
    const host = new URL(url).hostname.replace(/^www\./, '');
    return host;
  } catch { return ''; }
}

function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function escapeAttr(str) {
  return str.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function formatDate(iso) {
  if (!iso) return 'N/A';
  try {
    return new Date(iso).toLocaleString();
  } catch { return iso; }
}

// ===== DELEGATED CLICK HANDLER =====
// Replaces all inline onclick handlers that embed dynamic lead IDs.
// Uses data-lead-id attributes + event delegation for reliable ID handling.
document.addEventListener('click', function(e) {
  const el = e.target.closest('[data-lead-id]');
  if (!el) return;
  const id = el.dataset.leadId;

  // Table save button or sidebar save button
  if (el.classList.contains('btn-save-lead')) {
    e.stopPropagation();
    toggleSaveLeadById(id);
    if (el.closest('#sidebar')) {
      openDetail(id);
    } else {
      renderResults();
    }
    return;
  }

  // Table row click -> open detail
  if (el.classList.contains('row-detail')) {
    openDetail(id);
    return;
  }

});

// ===== INIT =====
loadSavedLeads();
updateSavedBadge();
renderCurrentTab();

// Close sidebar on Escape key
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    if (document.getElementById('sidebar').classList.contains('open')) {
      closeSidebar();
    }
  }
});
</script>
